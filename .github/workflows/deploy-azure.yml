name: Deploy to Azure Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            # Ensure standard binaries (node, npm, git) are in PATH
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            
            echo "==> Navigating to project directory..."
            if [ -d "/var/www/imagitech-online" ]; then
              cd /var/www/imagitech-online
            elif [ -d "$HOME/imagitech-online" ]; then
              cd "$HOME/imagitech-online"
            else
              echo "Error: imagitech-online directory not found" >&2
              exit 1
            fi
            
            echo "==> Pulling latest changes from main branch..."
            git fetch origin main
            # Discard any local drift (e.g. recreated feed.xml) and match origin exactly
            git reset --hard origin/main
            
            echo "==> Installing dependencies if needed..."
            npm ci --prefer-offline --no-audit
            
            echo "==> Compiling static production build & search indexes..."
            npm run build
            
            echo "==> Deployment completed successfully at $(date)!"
